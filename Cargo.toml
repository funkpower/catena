[workspace]
resolver = "3"
members = ["crates/*", "parity"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://git.pumpin.online/funkpower/catena"

[workspace.dependencies]
corpus-core = { path = "crates/corpus-core", version = "0.1.0" }
textkit = { path = "crates/textkit", version = "0.1.0" }
chunkmd = { path = "crates/chunkmd", version = "0.1.0" }
mdscrub = { path = "crates/mdscrub", version = "0.1.0" }
pdftriage = { path = "crates/pdftriage", version = "0.1.0" }

clap = { version = "4", features = ["derive"] }
fancy-regex = "0.16"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it a float read back from JSON can be one unit in
# the last place away from the one that was written, which would make a
# record that round-trips through a pipe not the record it started as.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
unicode-general-category = "1"
tiktoken-rs = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
